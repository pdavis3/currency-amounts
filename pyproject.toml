[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-amounts"
version = "0.1.0"
description = "A validating parser and pretty printer for currency amounts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pdavis3" }]
keywords = ["currency", "money", "parsing", "formatting", "iso4217"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Repository = "https://github.com/pdavis3/currency-amounts"

[tool.setuptools.packages.find]
include = ["currency_amounts*"]
