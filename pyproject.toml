[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-amounts"
version = "0.1.0"
description = "A validating parser and pretty printer for currency amounts"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["currency_amounts*"]
